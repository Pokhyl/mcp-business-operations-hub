name: Recovery sync MCP exports

on:
  push:
    branches:
      - recovery-sync-20260915

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact final commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE="e6b79e71113e48f7aed461d6d2b197d7793b006c"
          EXPECTED_PATCH_SHA256="90ac9d10831f1ffb5f9c15f502172a9c2af9314592aba0232f7ed79b7dc7b75b"
          EXPECTED_TREE="28a4b7bbe5e358cd4d322ff65d51eb3c330a578b"

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"

          cat .recovery/mcp-main-to-final.patch.b64.part* | base64 -d > /tmp/mcp-main-to-final.patch.xz
          echo "$EXPECTED_PATCH_SHA256  /tmp/mcp-main-to-final.patch.xz" | sha256sum -c -
          xz -dc /tmp/mcp-main-to-final.patch.xz > /tmp/mcp-main-to-final.patch

          git checkout --detach "$EXPECTED_BASE"
          git apply --check /tmp/mcp-main-to-final.patch
          git apply /tmp/mcp-main-to-final.patch
          python scripts/validate_n8n_exports.py
          git add -A

          TREE="$(git write-tree)"
          test "$TREE" = "$EXPECTED_TREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FINAL="$(printf '%s\n' 'chore: sync complete production MCP workflow exports' | git commit-tree "$TREE" -p "$EXPECTED_BASE")"
          git push origin "$FINAL:refs/heads/recovery-final-20260915" --force
          echo "FINAL_SHA=$FINAL" >> "$GITHUB_ENV"
      - name: Show final SHA
        run: echo "$FINAL_SHA"
